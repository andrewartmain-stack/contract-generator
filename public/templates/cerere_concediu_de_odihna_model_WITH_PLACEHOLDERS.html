<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Calibri', 'Arial', sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .document {
            background-color: white;
        }

        p {
            margin: 10px 0;
        }

        strong,
        b {
            font-weight: bold;
        }

        em,
        i {
            font-style: italic;
        }

        u {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        td {
            padding: 8px;
            border: 1px solid #ddd;
        }

        .placeholder {
            padding: 2px 4px;
            border-radius: 3px;
        }

        .underline-blank {
            border-bottom: 1px solid #000;
            display: inline-block;
            min-width: 100px;
        }
    </style>
</head>

<body>
    <div class="document">
        <br>
        <br>
        <br>
        <p style="text-align: center">Domnule Director,</p>
        <br>
        <p>Subsemnatul <span class="placeholder">{{employee_name_worker_field}}</span>, angajat al societatii <span
                class="placeholder">{{company_name_company_field}}</span>, avand functia de <span
                class="placeholder">{{worker_position_worker_field}}</span>, va rog sa imi aprobati cererea de concediu
            de odihna in perioada <strong><span class="underline-blank"></span></strong>.</p>
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <p>
            Data: <strong><span class="underline-blank"></span></strong>
        </p>
        <br>
        <p>
            Semnatura: <strong><span class="underline-blank"></span></strong>
        </p>
        <br>
    </div>
</body>

</html>
